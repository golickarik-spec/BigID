name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write          # push image to GHCR
  pull-requests: write      # AI diagnosis sticky comment
  security-events: write    # upload SARIF to the Security tab
  actions: read             # read failed-job logs via the API
  id-token: write           # keyless cosign signing + SLSA provenance (OIDC)
  attestations: write       # actions/attest-build-provenance

env:
  IMAGE_NAME: ipapp

jobs:
  # 1) lint + unit tests ----------------------------------------------------
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Unit tests (pytest)
        run: pytest -q

  # 2) build image, push to GHCR, export tar for downstream jobs ------------
  build-push:
    needs: lint-test
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute image ref (lowercased owner, commit SHA tag)
        id: meta
        run: |
          owner="${{ github.repository_owner }}"
          image="ghcr.io/${owner,,}/${IMAGE_NAME}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${image}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image (tagged with commit SHA)
        run: docker build -t "${{ steps.meta.outputs.image_ref }}" .
      - name: Tag :latest on default branch
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: docker tag "${{ steps.meta.outputs.image_ref }}" "${{ steps.meta.outputs.image }}:latest"
      - name: Push image(s)
        run: docker push --all-tags "${{ steps.meta.outputs.image }}"
      - name: Resolve pushed digest
        id: digest
        run: |
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' \
            "${{ steps.meta.outputs.image_ref }}" | cut -d@ -f2)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "pushed ${{ steps.meta.outputs.image }}@${digest}"
      - name: Export image to tarball
        run: docker save "${{ steps.meta.outputs.image_ref }}" -o image.tar
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-tar
          path: image.tar
          retention-days: 1
      # --- supply-chain: keyless signing + provenance (operate on the digest) ---
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless, Sigstore OIDC)
        run: cosign sign --yes "${{ steps.meta.outputs.image }}@${{ steps.digest.outputs.digest }}"
      - name: Verify the signature we just made
        run: |
          cosign verify "${{ steps.meta.outputs.image }}@${{ steps.digest.outputs.digest }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp \
            "^https://github.com/${{ github.repository }}/.github/workflows/ci.yaml@.*" \
            > /dev/null && echo "signature verified"
      - name: Attest SLSA build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

  # 3) vulnerability scan (hard gate) + SBOM + SARIF ------------------------
  scan:
    needs: build-push
    runs-on: ubuntu-latest
    env:
      IMAGE_REF: ${{ needs.build-push.outputs.image_ref }}
      IMAGE: ${{ needs.build-push.outputs.image }}
      DIGEST: ${{ needs.build-push.outputs.digest }}
      TRIVY_VERSION: v0.76.2
    steps:
      - uses: actions/checkout@v4
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-tar
      - name: Load image into Docker
        run: docker load -i image.tar
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b "${RUNNER_TEMP}/bin" "${TRIVY_VERSION}"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
      - name: Generate SBOM (CycloneDX)
        run: trivy image --format cyclonedx --output sbom.cdx.json "${IMAGE_REF}"
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 7
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest SBOM to the image (keyless)
        run: |
          cosign attest --yes --type cyclonedx \
            --predicate sbom.cdx.json "${IMAGE}@${DIGEST}"
      - name: Scan -> SARIF (non-blocking, for Security tab)
        run: |
          trivy image --format sarif --output trivy-results.sarif \
            --severity HIGH,CRITICAL "${IMAGE_REF}"
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image
        continue-on-error: true
      - name: Scan gate (fail on HIGH/CRITICAL)
        run: |
          trivy image --exit-code 1 --format table \
            --severity HIGH,CRITICAL \
            --ignorefile .trivyignore "${IMAGE_REF}"

  # 4) helm lint ------------------------------------------------------------
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: helm lint charts/ipapp

  # 4b) static analysis: secrets, SAST, Dockerfile + IaC misconfig ----------
  # Blocking: gitleaks (secrets) + bandit (python SAST).
  # Annotate-only (SARIF to Security tab): hadolint + trivy config — these flag
  # the unavoidable Chainguard ':latest' base, so they must not gate.
  static-analysis:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.21.2"
      TRIVY_VERSION: v0.76.2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so gitleaks can scan past commits
      # --- secret scanning (BLOCKING) ---
      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}" gitleaks
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"
      - name: gitleaks (secret scan)
        run: gitleaks detect --source . --redact --report-format sarif --report-path gitleaks.sarif
      - name: Upload gitleaks SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
        continue-on-error: true
      # --- python SAST (BLOCKING) ---
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bandit
        run: pip install "bandit[sarif]>=1.8"
      - name: Bandit SARIF report
        run: bandit -r app/ -f sarif -o bandit.sarif || true
      - name: Upload bandit SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif
          category: bandit
        continue-on-error: true
      - name: Bandit gate
        run: bandit -r app/
      # --- Dockerfile lint (ANNOTATE) ---
      - name: hadolint (Dockerfile)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          format: sarif
          output-file: hadolint.sarif
          no-fail: true
          ignore: DL3007   # Chainguard free tier only serves :latest
      - name: Upload hadolint SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: hadolint.sarif
          category: hadolint
        continue-on-error: true
      # --- IaC / config misconfig: Dockerfile + Helm chart (ANNOTATE) ---
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b "${RUNNER_TEMP}/bin" "${TRIVY_VERSION}"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
      - name: Trivy config (misconfig scan)
        run: trivy config --format sarif --output trivyconfig.sarif . || true
      - name: Upload trivy-config SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivyconfig.sarif
          category: trivy-config
        continue-on-error: true

  # 5) deploy to kind + smoke test -----------------------------------------
  deploy-smoke:
    needs: [build-push, scan, helm-lint]
    runs-on: ubuntu-latest
    env:
      CLUSTER_NAME: ipapp-ci
      NAMESPACE: staging
    steps:
      - uses: actions/checkout@v4
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-tar
      - uses: azure/setup-helm@v4
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ipapp-ci
      - name: Load image into kind
        run: kind load image-archive image.tar --name "${CLUSTER_NAME}"
      - name: Deploy with Helm
        run: |
          helm upgrade --install "${IMAGE_NAME}" charts/ipapp \
            --namespace "${NAMESPACE}" --create-namespace \
            --set image.repository="$(echo "${{ needs.build-push.outputs.image_ref }}" | cut -d: -f1)" \
            --set image.tag="${GITHUB_SHA}" \
            --set image.pullPolicy=Never \
            --wait --timeout 120s
      - name: Show rollout status
        run: kubectl -n "${NAMESPACE}" rollout status deploy/"${IMAGE_NAME}" --timeout=120s
      - name: Smoke test (/, /health, /ready)
        run: |
          kubectl -n "${NAMESPACE}" port-forward svc/"${IMAGE_NAME}" 8080:80 >/dev/null 2>&1 &
          PF_PID=$!
          trap 'kill $PF_PID' EXIT
          for i in $(seq 1 15); do
            curl -fsS http://127.0.0.1:8080/health && break
            echo "waiting for app... ($i)"; sleep 2
          done
          echo "--- /health ---"; curl -fsS http://127.0.0.1:8080/health; echo
          echo "--- /ready  ---"; curl -fsS http://127.0.0.1:8080/ready;  echo
          echo "--- /       ---"; curl -fsS http://127.0.0.1:8080/;       echo
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n "${NAMESPACE}" get pods -o wide || true
          kubectl -n "${NAMESPACE}" describe deploy/"${IMAGE_NAME}" || true
          kubectl -n "${NAMESPACE}" logs deploy/"${IMAGE_NAME}" --all-containers --tail=100 || true

  # 6) AI diagnosis on failure ---------------------------------------------
  ai-diagnose:
    needs: [lint-test, build-push, scan, helm-lint, static-analysis, deploy-smoke]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Collect failed-job logs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          # `gh run view --log` can't download logs while the run is still in
          # progress (this job is part of it). Instead pull each already-finished
          # failed job's logs directly via the jobs REST API.
          failed_ids=$(gh api "repos/${REPO}/actions/runs/${GITHUB_RUN_ID}/jobs" \
            --paginate --jq '.jobs[] | select(.conclusion=="failure") | .id')
          : > failed.log
          names=""
          if [ -z "$failed_ids" ]; then
            echo "(no failed jobs reported by the API)" > failed.log
          else
            for jid in $failed_ids; do
              name=$(gh api "repos/${REPO}/actions/jobs/${jid}" --jq '.name')
              names="${names:+$names, }${name}"
              echo "===== FAILED JOB: ${name} (id ${jid}) =====" >> failed.log
              # The logs endpoint 302-redirects to blob storage. Use curl (not
              # `gh api`) so the Authorization header is dropped on the
              # cross-host redirect; otherwise the signed URL returns 403.
              curl -sSL -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${REPO}/actions/jobs/${jid}/logs" \
                >> failed.log 2>/dev/null \
                || echo "(could not fetch logs for job ${jid})" >> failed.log
              echo >> failed.log
            done
          fi
          echo "FAILED_JOBS=${names:-unknown}" >> "$GITHUB_ENV"
          echo "collected $(wc -c < failed.log) bytes of logs"
      - name: Diagnose with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/ai_diagnose.py failed.log diagnosis.md
      - name: Add to job summary
        run: cat diagnosis.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post sticky PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = '<!-- ai-diagnosis -->\n' + fs.readFileSync('diagnosis.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find(c => c.body && c.body.includes('<!-- ai-diagnosis -->'));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
